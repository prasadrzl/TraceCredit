specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: LendingPool
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"  # replace after deploy
      abi: LendingPool
      startBlock: 0  # replace with actual deploy block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
        - Repayment
        - Borrower
        - ProtocolStats
      abis:
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: LoanCreated(indexed uint256,indexed address,uint256,uint256)
          handler: handleLoanCreated
        - event: LoanRepaid(indexed uint256,indexed address,uint256,bool)
          handler: handleLoanRepaid
        - event: GracePeriodTriggered(indexed uint256,indexed address)
          handler: handleGracePeriodTriggered
        - event: LoanDefaulted(indexed uint256,indexed address,uint256)
          handler: handleLoanDefaulted
        - event: LoanWrittenOff(indexed uint256,indexed address)
          handler: handleLoanWrittenOff
      file: ./src/lending-pool.ts

  - kind: ethereum
    name: LiquidationManager
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"  # replace after deploy
      abi: LiquidationManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Liquidation
        - Loan
        - Borrower
        - ProtocolStats
      abis:
        - name: LiquidationManager
          file: ./abis/LiquidationManager.json
      eventHandlers:
        - event: LoanLiquidated(indexed uint256,indexed address,uint256,uint256)
          handler: handleLoanLiquidated
      file: ./src/liquidation-manager.ts

  - kind: ethereum
    name: ReputationSBT
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"  # replace after deploy
      abi: ReputationSBT
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SBTHolder
        - ScoreUpdate
      abis:
        - name: ReputationSBT
          file: ./abis/ReputationSBT.json
      eventHandlers:
        - event: SBTMinted(indexed address,uint256)
          handler: handleSBTMinted
        - event: SBTBurned(indexed address,uint256)
          handler: handleSBTBurned
        - event: ScoreUpdated(indexed address,uint16,int16)
          handler: handleScoreUpdated
      file: ./src/reputation-sbt.ts

  - kind: ethereum
    name: ScoreEngine
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"  # replace after deploy
      abi: ScoreEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SignalEvent
      abis:
        - name: ScoreEngine
          file: ./abis/ScoreEngine.json
      eventHandlers:
        - event: SignalProcessed(indexed address,indexed uint8,int16)
          handler: handleSignalProcessed
        - event: DecayApplied(indexed address,int16)
          handler: handleDecayApplied
      file: ./src/score-engine.ts
